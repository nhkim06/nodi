<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NO:DI</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/canvas.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/nodi.css">
  <script type="module" src="js/pages/app.js"></script>
</head>
<body class="app-page">
  <div id="topnav"></div>
  <div class="app" id="app">
    <!-- 왼쪽: 프로젝트 상세 메뉴 (아이디어 맵 / 과제 요구사항 / 팀원 / 작업 링크 / 나의 작업) + 보조 패널 -->
    <aside class="app__left" aria-label="프로젝트 메뉴">
      <nav class="side-nav" id="side-nav" aria-label="프로젝트 상세 메뉴"></nav>
      <div class="side-panel panel-scroll" id="sidebar"></div>
    </aside>

    <main class="app__center">
      <div class="proj-bar" id="proj-head"></div>

      <!-- 아이디어 맵: 캔버스 보드 -->
      <div class="board" id="board">
        <div class="topbar">
          <nav class="breadcrumb" id="breadcrumb" aria-label="현재 위치"></nav>
        </div>
        <div class="toolbar" id="toolbar" role="toolbar" aria-label="캔버스 도구"></div>
        <div class="viewport" id="viewport">
          <div class="world" id="world">
            <svg class="edges" id="edges" aria-hidden="true"></svg>
            <div id="nodes"></div>
            <div id="bubbles"></div>
          </div>
          <div class="zoom" id="zoom"></div>
          <div class="canvas-hint">더블클릭: 새 노드 · Tab: 자식 · Enter: 형제 · F2: 이름 변경 · Shift+드래그: 범위 선택 · Space+드래그/휠: 이동 · Ctrl+휠: 확대</div>
        </div>
      </div>

      <!-- 나머지 메뉴: 페이지 보드 -->
      <div class="board board--page" id="page" hidden></div>
    </main>

    <aside class="app__right" aria-label="상세 정보">
      <div class="panel-collapse">
        <button class="icon-btn" id="toggle-right" title="패널 접기" aria-label="오른쪽 패널 접기/펼치기">»</button>
      </div>
      <div class="collapsed-icons">
        <span class="small muted">상세</span>
      </div>
      <div class="panel-scroll" id="right"></div>
    </aside>
  </div>
</body>
</html>
